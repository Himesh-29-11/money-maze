# Hostinger Cloud VPS — Nginx config for Money Maze (Laravel 11)
# Copy to: /etc/nginx/sites-available/money-maze
# Enable:  sudo ln -s /etc/nginx/sites-available/money-maze /etc/nginx/sites-enabled/
# Test:     sudo nginx -t && sudo systemctl reload nginx
#
# Replace YOUR_DOMAIN.com and /var/www/money-maze with your values.

server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN.com www.YOUR_DOMAIN.com;

    root /var/www/money-maze/public;
    index index.php;

    charset utf-8;
    client_max_body_size 10M;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        fastcgi_pass unix:/var/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
